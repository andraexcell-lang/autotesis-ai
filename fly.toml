# fly.toml - Konfigurasi Fly.io
# Deploy: flyctl deploy
# Region sin = Singapore -> latency terendah ke Indonesia, GRATIS di Fly.io.

app = "autotesis-ai"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  # API keys di-set via:
  #   flyctl secrets set GEMINI_API_KEYS='["key1","key2",...]' NVIDIA_API_KEY=nvapi-xxx
  #   (atau LLM_MODELS, LLM_TIMEOUT — lihat llm_title_parser.load_config)

# Port yang di-bind server.py (default 5050; FLY_APP_NAME -> mode CLOUD, HTTP saja)
[http_service]
  internal_port = 5050
  force_https = true
  auto_stop_machines = false      # always-on: TANPA cold start
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"          # beri waktu startup (import berat)
    method = "GET"
    path = "/api/healthz"

[processes]
  app = "python -u backend/server.py"

# Volume permanen agar variable_library/ & cache TIDAK hilang saat restart.
[mounts]
  source = "variable_library"
  destination = "/app/backend/variable_library"

# VM free allowance: shared-cpu-1x / 256MB (default)
[vm]
  size = "shared-cpu-1x"
  memory = "256mb"
