# render.yaml - Infrastructure as Code untuk Render.com (backend Python)
# Deploy: push ke GitHub -> dashboard Render -> New > Blueprint -> pilih repo.
#
# Catatan penting:
# - Render FREE: instance tidur setelah ~15 menit idle; permintaan pertama
#   butuh ~30-60 detik (cold start). Untuk add-in Word sebaiknya upgrade
#   Starter ($7/bln) agar selalu hidup, atau pakai Cloudflare Tunnel ke PC.
# - PyMuPDF (fitz) sudah menyediakan wheel manylinux -> TIDAK perlu apt-get.
# - --chdir memastikan import antar-modul backend (flat imports) tetap jalan.

services:
  - type: web
    name: autotesis-api
    runtime: python
    plan: free
    region: oregon          # free tier: oregon (Singapore butuh paket berbayar)
    branch: main
    rootDir: .
    buildCommand: pip install --no-cache-dir -r requirements.render.txt
    startCommand: python backend/server.py
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      # PORT disediakan otomatis oleh Render -> server.py masuk mode CLOUD
      # (HTTP saja, TLS dihentikan proxy Render).
      #
      # API key JANGAN ditulis di sini (repo publik). Isi di dashboard
      # Render > Environment, atau lewat `sync: false` agar diminta saat deploy:
      - key: GEMINI_API_KEYS
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: LLM_MODELS
        sync: false
