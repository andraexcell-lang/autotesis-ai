# render.yaml - Infrastructure as Code untuk Render.com
# Deploy: push ke GitHub → connect di dashboard.render.com → auto deploy

services:
  - type: web
    name: independent-researcher
    runtime: python
    region: oregon  # free tier hanya oregon; upgrade $7/bln untuk singapore
    branch: main
    # PyMuPDF butuh libmupdf-dev di runtime image.
    buildCommand: >
      apt-get update && apt-get install -y --no-install-recommends libmupdf-dev
      && pip install --no-cache-dir -r requirements.txt
    # Server berbasis http.server (bukan Flask) -> jalankan langsung.
    # PORT dibaca dari env oleh backend/server.py (mode CLOUD: hanya HTTP).
    startCommand: python backend/server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # API Keys di-set manual di dashboard Environment Variables (lebih aman):
      #   GEMINI_API_KEYS = ["key1","key2",...] (JSON array)
      #   NVIDIA_API_KEY  = nvapi-xxx
    healthCheckPath: /api/healthz
    autoDeploy: true
    # Persistent Disk untuk variable_library (butuh upgrade $7/bln)
    # disk:
    #   name: variable-library
    #   mountPath: /opt/render/project/src/backend/variable_library
    #   sizeGB: 1
